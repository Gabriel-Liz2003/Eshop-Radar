name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'release-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck Worker
        run: npm run typecheck

      - name: Ensure Android signing secret exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD não está configurado em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Decrypt Android signing key
        shell: bash
        run: |
          set -euo pipefail
          base64 -d android/release-keystore.jks.enc.b64 > "$RUNNER_TEMP/eshop-radar-release.jks.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in "$RUNNER_TEMP/eshop-radar-release.jks.enc" \
            -out "$RUNNER_TEMP/eshop-radar-release.jks" \
            -pass env:ANDROID_KEYSTORE_PASSWORD

          keytool -list \
            -keystore "$RUNNER_TEMP/eshop-radar-release.jks" \
            -alias eshopradar \
            -storepass:env ANDROID_KEYSTORE_PASSWORD >/dev/null

      - name: Build unsigned Android APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="$RUNNER_TEMP/eshop-radar-twa"
          mkdir -p "$BUILD_DIR"
          cp android/twa-manifest.json "$BUILD_DIR/twa-manifest.json"
          cp "$RUNNER_TEMP/eshop-radar-release.jks" "$BUILD_DIR/android.keystore"

          docker run --rm \
            -v "$BUILD_DIR:/workspace" \
            -w /workspace \
            ghcr.io/googlechromelabs/bubblewrap:latest \
            update --skipVersionUpgrade --manifest=/workspace/twa-manifest.json

          set +o pipefail
          yes | docker run -i --rm \
            -v "$BUILD_DIR:/workspace" \
            -w /workspace \
            ghcr.io/googlechromelabs/bubblewrap:latest \
            build --skipSigning --skipPwaValidation --manifest=/workspace/twa-manifest.json
          BUILD_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          test "$BUILD_STATUS" -eq 0

          test -f "$BUILD_DIR/app-release-unsigned-aligned.apk"
          test -f "$BUILD_DIR/app/build/outputs/bundle/release/app-release.aab"

      - name: Sign and verify APK on GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="$RUNNER_TEMP/eshop-radar-twa"
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/eshop-radar-release.jks" \
            --ks-key-alias eshopradar \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out Eshop-Radar.apk \
            "$BUILD_DIR/app-release-unsigned-aligned.apk"

          "$APKSIGNER" verify --verbose --print-certs Eshop-Radar.apk

      - name: Sign Android App Bundle on GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="$RUNNER_TEMP/eshop-radar-twa"
          cp "$BUILD_DIR/app/build/outputs/bundle/release/app-release.aab" Eshop-Radar.aab

          jarsigner \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/eshop-radar-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEYSTORE_PASSWORD" \
            Eshop-Radar.aab eshopradar

          jarsigner -verify Eshop-Radar.aab

      - name: Build source ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip -r eshop-br-alert-source.zip . \
            -x '.git/*' \
               'node_modules/*' \
               '.wrangler/*' \
               '.dev.vars' \
               '.eshop-setup.json' \
               'android/android.keystore' \
               'Eshop-Radar.apk' \
               'Eshop-Radar.aab' \
               'eshop-br-alert-source.zip'

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE_TAG="v$(node -p "require('./version.json').version")"

          # Limpa a release acidental criada com a branch "main" pela primeira versão do workflow.
          if gh release view main --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete main --cleanup-tag -y --repo "${GITHUB_REPOSITORY}"
          fi

          if gh release view "$RELEASE_TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              Eshop-Radar.apk \
              Eshop-Radar.aab \
              eshop-br-alert-source.zip \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "$RELEASE_TAG" \
              Eshop-Radar.apk \
              Eshop-Radar.aab \
              eshop-br-alert-source.zip \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "eShop BR Alert $RELEASE_TAG" \
              --generate-notes
          fi
