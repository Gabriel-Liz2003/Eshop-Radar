name: Deploy Worker

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eshop-br-alert-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Cloudflare CI credentials
        id: cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deploy automático ainda não configurado. Adicione CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID em Settings > Secrets and variables > Actions."
          fi

      - name: Install dependencies
        if: steps.cloudflare.outputs.ready == 'true'
        run: npm install

      - name: Typecheck
        if: steps.cloudflare.outputs.ready == 'true'
        run: npm run typecheck

      - name: Deploy to Cloudflare Workers
        if: steps.cloudflare.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --keep-vars

      - name: Deployment not configured
        if: steps.cloudflare.outputs.ready != 'true'
        run: |
          echo "O código está pronto para deploy automático."
          echo "Só faltam os dois secrets da Cloudflare no repositório."
