name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - name: Build update ZIP
        run: |
          zip -r eshop-br-alert-android.zip . \
            -x '.git/*' 'node_modules/*' '.wrangler/*' '.dev.vars' '.eshop-setup.json' 'eshop-br-alert-android.zip'
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" eshop-br-alert-android.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "eShop BR Alert ${GITHUB_REF_NAME}" \
            --generate-notes
